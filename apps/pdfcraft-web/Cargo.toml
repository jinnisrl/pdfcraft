[package]
name = "pdfcraft-web"
description = "PdfCraft in the browser (wasm32; build with `trunk build --release` in this directory)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# `trunk build --release --features unbranded`: a build without the ArtCraft name and marks,
# for sites that host a modified PdfCraft (docs/brand/LICENSE-brand.txt).
unbranded = ["pdfcraft-ui-egui/unbranded"]

[lints]
workspace = true

[dependencies]
pdfcraft-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "glow", "persistence", "accesskit"] }
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlElement", "Location", "Url", "UrlSearchParams", "Response", "Event", "MessageEvent", "EventTarget"] }
js-sys = "0.3"
